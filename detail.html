<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>게시판</title>
  </head>

  <body>
    <!--헤더-->
    <header>
      <a class="brand" href="index.html">게시판</a>
      <nav>
        <a href="index.html">게시판</a>
        <a class="write-link" href="write.html">글쓰기</a>
        <a class="login-link" href="login.html">로그인</a>
        <button class="logout-button" type="button">로그아웃</button>
      </nav>
    </header>

    <!--바디-->
    <main>
      <article>
        <h1 id="post-title">첫번째 게시글</h1>
        <p id="post-meta" class="meta">학생 / 2026-10-03</p>
        <p id="post-contetn">게시판 실습 내용</p>
      </article>
      <a href="index.html">목록으로</a>
      <section id="comment-section">
        <h2>댓글</h2>
        <!-- 목록 영역 -->
        <ul>
          <li>
            <strong>학생</strong>
            <p>첫 댓글입니다</p>
          </li>
        </ul>
        <!-- 댓글 입력창 -->
        <form id="comment-form">
          <label>댓글내용</label>
          <textarea id="comment-content" name="content" required></textarea>
          <button type="submit">댓글 등록</button>
        </form>
      </section>
    </main>

    <!--풋터-->
    <footer></footer>
  </body>
</html>
